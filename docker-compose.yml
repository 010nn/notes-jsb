version: '3.8'

services:
  notes-jsb-psql:
    image: postgres:15-alpine
    container_name: notes-jsb-psql
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5


  notes-jsb-jre:
    build: .
    container_name: notes-jsb-jre
    restart: always
    environment:
      - DB_URL=jdbc:postgresql://notes-jsb-psql:${DB_PORT}/${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    ports:
      - "${JAVA_PORT}:8080"
    depends_on:
      notes-jsb-psql:
        condition: service_healthy

volumes:
  pgdata:
