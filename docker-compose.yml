version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: notebook_postgres
    environment:
      POSTGRES_DB: notebook_db
      POSTGRES_USER: notebook_user
      POSTGRES_PASSWORD: notebook_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
