<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${note.id != null} ? 'edit note' : 'new note'">Note - Notebook</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-container">
        <!-- Left Panel -->
        <div class="left-panel">
            <!-- Service Block -->
            <div class="service-block">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span class="user-greeting" sec:authentication="name"></span>
                    <a th:href="@{/notes}" class="logout-link">log out</a>
                </div>
                <div class="save-indicator">All changes saved</div>
            </div>
            
            <!-- Notes Header -->
            <div class="notes-header">
                <h2 class="notes-title">Notes</h2>
                <div class="notes-actions">
                    <a th:href="@{/notes/new}" class="icon-btn" title="new note">+</a>
                    <a href="#" class="icon-btn" title="edit">🖊</a>
                    <a href="#" class="icon-btn" title="delete">✕</a>
                </div>
            </div>
            
            <!-- Notes List -->
            <div class="notes-list-container">
                <a th:href="@{/notes/{id}/edit(id=${note.id})}" 
                   th:each="note : ${allNotes}"
                   th:classappend="${note.id == note?.id} ? 'active'"
                   class="note-item"
                   th:text="${note.title}">
                </a>
            </div>
        </div>
        
        <!-- Right Panel -->
        <div class="right-panel">
            <div class="editor-container">
                <form th:action="${note.id != null} ? @{/notes/{id}(id=${note.id})} : @{/notes}" 
                      method="post">
                    <input type="text" 
                           class="editor-title" 
                           id="title" 
                           name="title" 
                           placeholder="untitled"
                           th:value="${note.title}" 
                           required>
                    <textarea class="editor-content" 
                              id="content" 
                              name="content" 
                              placeholder="start writing..."
                              th:text="${note.content}"
                              required></textarea>
                    <div style="margin-top: 20px; display: flex; gap: 10px;">
                        <button type="submit" class="btn btn-primary" style="width: auto; padding: 10px 30px;">save</button>
                        <a th:href="@{/notes}" class="btn" style="width: auto; padding: 10px 30px;">cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
