<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${note.id != null} ? 'Edit Note' : 'New Note'">Note - Notebook</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h1 th:text="${note.id != null} ? 'Edit Note' : 'New Note'"></h1>
        
        <form th:action="${note.id != null} ? @{/notes/{id}(id=${note.id})} : @{/notes}" 
              method="post">
            <div class="form-group">
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" 
                       th:value="${note.title}" required>
            </div>
            <div class="form-group">
                <label for="content">Content:</label>
                <textarea id="content" name="content" rows="10" required th:text="${note.content}"></textarea>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn">Save</button>
                <a th:href="@{/notes}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
