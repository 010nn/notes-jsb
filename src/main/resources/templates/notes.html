<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>My Notes - Notebook</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-container">
        <!-- Left Panel -->
        <div class="left-panel">
            <!-- Service Block -->
            <div class="service-block">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span class="user-greeting" sec:authentication="name"></span>
                    <form th:action="@{/logout}" method="post" style="display:inline;">
                        <button type="submit" class="logout-link" style="background: none; border: none; cursor: pointer;">log out</button>
                    </form>
                </div>
                <div class="save-indicator">All changes saved</div>
            </div>
            
            <!-- Notes Header -->
            <div class="notes-header">
                <h2 class="notes-title">Notes</h2>
                <div class="notes-actions">
                    <a th:href="@{/notes/new}" class="icon-btn" title="new note">+</a>
                    <a href="#" class="icon-btn" title="edit">🖊</a>
                    <a href="#" class="icon-btn" title="delete">✕</a>
                </div>
            </div>
            
            <!-- Notes List -->
            <div class="notes-list-container">
                <div th:if="${#lists.isEmpty(notes)}" class="empty-state">
                    no notes yet. create your first note!
                </div>
                <a th:each="note : ${notes}" 
                   th:href="@{/notes/{id}/edit(id=${note.id})}"
                   class="note-item"
                   th:text="${note.title}">
                </a>
            </div>
        </div>
        
        <!-- Right Panel -->
        <div class="right-panel">
            <div class="editor-container">
                <div th:if="${success}" class="success" th:text="${success}" style="margin-bottom: 20px;"></div>
                
                <div th:if="${#lists.isEmpty(notes)}" class="empty-state" style="padding: 0;">
                    <p style="color: #606060; font-size: 16px;">select a note or create a new one</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
