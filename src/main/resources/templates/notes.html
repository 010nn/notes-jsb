<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>My Notes - Notebook</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-container">
        <!-- Left Panel -->
        <div class="left-panel">
            <!-- Service Block -->
            <div class="service-block">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span>hi, <span class="user-greeting" sec:authentication="name"></span>!</span>
                    <form th:action="@{/logout}" method="post" style="display:inline;">
                        <button type="submit" class="logout-link" style="background: none; border: none; cursor: pointer;">log out</button>
                    </form>
                </div>
            </div>
            
            <!-- Notes Header -->
            <div class="notes-header">
                <h2 class="notes-title">Notes</h2>
                <div class="notes-actions">
                    <a th:href="@{/notes/new}" class="icon-btn" title="new note">+</a>
                    <form th:if="${activeNoteId != null}"
                          th:action="@{/notes/{id}/delete(id=${activeNoteId})}"
                          method="post"
                          style="display: inline;">
                        <button type="submit" class="icon-btn" title="delete">✕</button>
                    </form>
                </div>
            </div>
            
            <!-- Notes List -->
            <div class="notes-list-container">
                <div th:if="${#lists.isEmpty(notes)}" class="empty-state">
                    no notes yet. create your first note!
                </div>
                <a th:each="note : ${notes}" 
                   th:href="@{/notes/{id}(id=${note.id})}"
                   th:class="'note-item' + (${note.id == activeNoteId} ? ' active' : '')"
                   th:text="${note.title}">
                </a>
            </div>
        </div>
        
        <!-- Right Panel -->
        <div class="right-panel">
            <div class="editor-container" th:if="${activeNote != null}">
                <form th:action="${activeNoteId == null} ? @{/notes/new} : @{/notes/{id}(id=${activeNoteId})}"
                      method="post">
                    <input type="hidden" name="id" th:value="${activeNoteId}">
                    <input type="text"
                           class="editor-title"
                           id="title"
                           name="title"
                           placeholder="untitled"
                           th:value="${activeNote.title}"
                           autocomplete="off"
                           required>
                    <textarea class="editor-content"
                              id="content"
                              name="content"
                              placeholder="start writing..."
                              th:text="${activeNote.content}"
                              required></textarea>
                    <button type="submit" class="btn btn-primary" style="width: auto; padding: 10px 30px;">save</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
