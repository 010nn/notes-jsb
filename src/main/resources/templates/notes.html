<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>My Notes - Notebook</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-container">
        <!-- Left Panel -->
        <div class="left-panel">
            <!-- Service Block -->
            <div class="service-block">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span>hi, <span class="user-greeting" sec:authentication="name"></span>!</span>
                    <form th:action="@{/logout}" method="post" style="display:inline;">
                        <button type="submit" class="logout-link" style="background: none; border: none; cursor: pointer;">log out</button>
                    </form>
                </div>
            </div>
            
            <!-- Notes Header -->
            <div class="notes-header">
                <h2 class="notes-title">Notes</h2>
                <div class="notes-actions">
                    <a class="icon-btn js-note-create" title="new note">+</a>
                    <button type="button"
                            class="icon-btn js-note-delete"
                            title="delete note">✕</button>
                </div>
            </div>
            
            <!-- Notes List -->
            <div class="notes-list-container js-notes-list">
            </div>
        </div>
        
        <!-- Right Panel -->
        <div class="right-panel">
            <div class="editor-container">
                <input type="hidden" class="js-active-note-id">
                <input type="text"
                       class="editor-title js-active-note-title"
                       placeholder="untitled"
                       autocomplete="off"
                       required>
                <textarea class="editor-content js-active-note-content"
                          placeholder="start writing..."
                          required></textarea>
            </div>
        </div>
    </div>

    <script type="text/javascript" th:src="@{/js/notes.js}"></script>
</body>
</html>
